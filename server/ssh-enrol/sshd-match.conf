# Add these directives to the existing Match Group ssh-tunnel-only block.
# Keep the trusted accounts in their existing configuration blocks.
Match Group ssh-tunnel-only
    MaxSessions 1
    ForceCommand /usr/local/libexec/jellyfin-ssh-enrol.py
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitOpen 127.0.0.1:8096
    PermitUserRC no
