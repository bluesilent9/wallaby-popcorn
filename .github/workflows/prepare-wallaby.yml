name: Finish source preparation (no APK build)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wallaby-popcorn
      - name: Remove local Python cache and keep source clean
        run: |
          git rm -r --ignore-unmatch server/ssh-enrol/__pycache__
          printf '\n# Local Python enrolment-test cache\n__pycache__/\n*.pyc\n' >> .gitignore
          git add .gitignore
          git config user.name 'Wallaby Popcorn'
          git config user.email 'bluesilent9@users.noreply.github.com'
          git commit -m 'Remove local Python cache from prepared source [skip ci]'
          git push origin HEAD:wallaby-popcorn
