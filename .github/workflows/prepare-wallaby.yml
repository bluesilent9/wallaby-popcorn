name: Publish tested Mobile source to Stable (no build)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Publish tested source and restore maintenance workflow
        env:
          SOURCE_PAYLOAD: 
          COMMIT_PAYLOAD: 
        run: |
          git config user.name 'Wallaby Popcorn'
          git config user.email 'bluesilent9@users.noreply.github.com'
          git checkout --detach 38d8dc1eb7660cee94ef48f9c37ab1e4a0df0b44
          python3 - <<'PYCODE'
          import os,base64,gzip,json,pathlib
          for name,content in json.loads(gzip.decompress(base64.b64decode(os.environ['SOURCE_PAYLOAD']))).items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          pathlib.Path('/tmp/stable-commit').write_bytes(base64.b64decode(os.environ['COMMIT_PAYLOAD']))
          PYCODE
          git add -- BUILD_NEXT.md README.md app/src/main/AndroidManifest.xml app/src/main/java/org/jellyfin/mobile/setup/ssh/AaaaDnsPacket.kt app/src/main/java/org/jellyfin/mobile/setup/ssh/SshAddressLookup.kt app/src/main/java/org/jellyfin/mobile/setup/ssh/SshAddressResolver.kt app/src/main/java/org/jellyfin/mobile/setup/ssh/SshFailureClassifier.kt app/src/main/java/org/jellyfin/mobile/setup/ssh/SshTunnelManager.kt app/src/test/java/org/jellyfin/mobile/setup/ssh/AaaaDnsPacketTest.kt app/src/test/java/org/jellyfin/mobile/setup/ssh/SshAddressLookupTest.kt app/src/test/java/org/jellyfin/mobile/setup/ssh/SshFailureClassifierTest.kt buildSrc/src/main/kotlin/VersionUtils.kt docs/SSH_REPAIR.md docs/SSH_REPAIR_SHA256.json
          test "$(git write-tree)" = e967a813ac7de9f68ba449ca00d38c379508972f
          test "$(git hash-object -t commit -w /tmp/stable-commit)" = c95908f7431136ea97c38ed1e878e4b14c0acd2a
          git push origin c95908f7431136ea97c38ed1e878e4b14c0acd2a:refs/heads/Stable
