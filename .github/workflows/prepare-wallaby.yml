name: Publish Development branding source (no build)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Publish Development source only
        env:
          SOURCE_PAYLOAD: 
          COMMIT_PAYLOAD: 
        run: |
          git checkout --detach 20c2c57367acd7140cbcf268581139e0e31a33c7
          python3 - <<'PYCODE'
          import os,base64,gzip,json,pathlib,shutil
          for name,content in json.loads(gzip.decompress(base64.b64decode(os.environ['SOURCE_PAYLOAD']))).items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          shutil.copyfile('app/src/main/assets/native/wallaby-popcorn-mark.png','app/src/main/res/drawable-nodpi/wallaby_mark.png')
          pathlib.Path('/tmp/development-commit').write_bytes(base64.b64decode(os.environ['COMMIT_PAYLOAD']))
          PYCODE
          git add -- README.md app/src/debug/res/drawable/app_logo.xml app/src/main/assets/native/injectionScript.js app/src/main/assets/native/wallaby-branding.js app/src/main/assets/native/wallaby-popcorn.css app/src/main/java/org/jellyfin/mobile/ui/screens/connect/ConnectScreen.kt app/src/main/java/org/jellyfin/mobile/webapp/JellyfinWebViewClient.kt app/src/main/res/drawable-nodpi/wallaby_mark.png app/src/main/res/drawable/app_logo.xml branding/transparent-logo-prompt.txt docs/DEVELOPMENT_BRANDING.md
          test "$(git write-tree)" = 1cb59383a3ae9ee27ed834240d87cca41f6c8995
          test "$(git hash-object -t commit -w /tmp/development-commit)" = 8288eafb1fc4d2c6a94469f032e0c6b99ba6e425
          git push origin 8288eafb1fc4d2c6a94469f032e0c6b99ba6e425:refs/heads/Development
